name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A concurrency group keeps one pending run at most, so each main commit gets its own group.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

env:
  CI: true
  TZ: Asia/Shanghai

jobs:
  preflight:
    name: Repository checks
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
      desktop-tests: ${{ steps.changes.outputs.desktop-tests }}
      sparkle: ${{ steps.changes.outputs.sparkle }}
      window-controls: ${{ steps.changes.outputs.window-controls }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Paths are filtered here rather than with `paths-ignore`: a skipped workflow would leave
      # the required `CI OK` check pending forever.
      - name: Detect changed paths
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DOCUMENTATION_PATHS: '^(docs/|(README|README_zh|CHANGELOG|CHANGELOG_zh|CONTEXT|AGENTS|CLAUDE)\.md$|\.github/pull_request_template\.md$|apps/desktop/AGENTS\.md$)'
          SPARKLE_PATHS: '^(apps/desktop/native/sparkle\.mm$|apps/desktop/scripts/(prepare|smoke)-sparkle\.mjs$|apps/desktop/package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.github/workflows/ci\.yml$)'
          WINDOW_CONTROLS_PATHS: '^(apps/desktop/native/window-controls/|apps/desktop/scripts/(prepare|smoke)-window-controls\.mjs$|apps/desktop/src/main/windows/(native-window-minimize|discussion-window-transition)\.ts$|apps/desktop/package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.github/workflows/ci\.yml$)'
        run: |
          code=true
          desktop_tests=true
          sparkle=true
          window_controls=true
          NON_DESKTOP_TEST_PATHS="(${DOCUMENTATION_PATHS})|^apps/(web|download|telemetry)/|^\.github/workflows/(release|sync-release-to-r2|reading-memory-model|reading-memory-model-cache)\.yml$"
          if [ -n "$PR_NUMBER" ]; then
            files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
              --jq '.[] | .filename, .previous_filename // empty')
            grep -qvE "$DOCUMENTATION_PATHS" <<<"$files" || code=false
            grep -qvE "$NON_DESKTOP_TEST_PATHS" <<<"$files" || desktop_tests=false
            grep -qE "$SPARKLE_PATHS" <<<"$files" || sparkle=false
            grep -qE "$WINDOW_CONTROLS_PATHS" <<<"$files" || window_controls=false
          fi
          echo "code=$code" >>"$GITHUB_OUTPUT"
          echo "desktop-tests=$desktop_tests" >>"$GITHUB_OUTPUT"
          echo "sparkle=$sparkle" >>"$GITHUB_OUTPUT"
          echo "window-controls=$window_controls" >>"$GITHUB_OUTPUT"

  static:
    name: Lint, format and typecheck
    needs: preflight
    if: needs.preflight.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          install-args: --ignore-scripts

      - name: Restore Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-v2-static-${{ hashFiles('pnpm-lock.yaml', 'mise.toml') }}-${{ github.sha }}
          restore-keys: |
            turbo-v2-static-${{ hashFiles('pnpm-lock.yaml', 'mise.toml') }}-

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

  test-packages:
    name: Test (packages)
    needs: preflight
    if: needs.preflight.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          install-args: --ignore-scripts

      - name: Restore Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-v2-test-packages-${{ hashFiles('pnpm-lock.yaml', 'mise.toml') }}-${{ github.sha }}
          restore-keys: |
            turbo-v2-test-packages-${{ hashFiles('pnpm-lock.yaml', 'mise.toml') }}-

      - name: Test
        run: pnpm test --filter=!@yomitomo/desktop

  test-desktop:
    name: Test (desktop ${{ matrix.shard }})
    needs: preflight
    if: needs.preflight.outputs.code == 'true' && needs.preflight.outputs.desktop-tests == 'true'
    runs-on: ubuntu-latest
    env:
      # `--ignore-scripts` skips Electron's binary download, so every test worker that loads
      # `electron` downloads it into the same directory and concurrent downloads collide. Unit
      # tests only need the module to load, never the binary.
      ELECTRON_OVERRIDE_DIST_PATH: /nonexistent/electron
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1/2
            cache: desktop-shard-1-of-2
          - shard: 2/2
            cache: desktop-shard-2-of-2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          install-args: --ignore-scripts

      - name: Restore Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-v2-test-${{ matrix.cache }}-${{ hashFiles('pnpm-lock.yaml', 'mise.toml') }}-${{ github.sha }}
          restore-keys: |
            turbo-v2-test-${{ matrix.cache }}-${{ hashFiles('pnpm-lock.yaml', 'mise.toml') }}-

      - name: Test
        run: pnpm test --filter=@yomitomo/desktop -- --shard=${{ matrix.shard }}

  build:
    name: Build and desktop e2e
    needs: preflight
    if: needs.preflight.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Restore Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-v2-build-${{ hashFiles('pnpm-lock.yaml', 'mise.toml') }}-${{ github.sha }}
          restore-keys: |
            turbo-v2-build-${{ hashFiles('pnpm-lock.yaml', 'mise.toml') }}-

      - name: Build
        run: pnpm build

      - name: Desktop e2e smoke
        run: xvfb-run -a pnpm test:app:e2e:from-dist

  sparkle:
    name: macOS Sparkle updates
    needs: preflight
    if: needs.preflight.outputs.sparkle == 'true'
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          package-manager-cache: false

      # The smoke test only uses Electron, its headers and Sparkle, not the workspace.
      - name: Install Electron and headers
        run: |
          version=$(sed -nE "s/^  electron@([0-9][^:(]*):.*/\1/p" pnpm-lock.yaml | head -1)
          npm install --prefix "$RUNNER_TEMP/electron" "electron@$version"
          echo "NODE_PATH=$RUNNER_TEMP/electron/node_modules" >>"$GITHUB_ENV"
          mkdir -p "$HOME/.electron-gyp/$version"
          curl --fail --silent --show-error --location \
            "https://artifacts.electronjs.org/headers/dist/v$version/node-v$version-headers.tar.gz" |
            tar -xz --strip-components=1 -C "$HOME/.electron-gyp/$version"

      - name: Build native Sparkle bridge
        run: node apps/desktop/scripts/prepare-sparkle.mjs

      - name: Verify signed delta updates and full fallback
        run: node apps/desktop/scripts/smoke-sparkle.mjs

  window-controls:
    name: Native minimize (${{ matrix.os }})
    needs: preflight
    if: needs.preflight.outputs.window-controls == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          install-args: --ignore-scripts

      - name: Install Electron
        run: node apps/desktop/node_modules/electron/install.js

      - name: Build native window controls
        run: node apps/desktop/scripts/prepare-window-controls.mjs

      - name: Verify native minimize interception
        run: node apps/desktop/scripts/smoke-window-controls.mjs

  ci-ok:
    name: CI OK
    needs: [preflight, static, test-packages, test-desktop, build, sparkle, window-controls]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
