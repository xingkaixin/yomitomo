name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A concurrency group keeps one pending run at most, so each main commit gets its own group.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

env:
  CI: true
  TZ: Asia/Shanghai

jobs:
  preflight:
    name: Repository checks
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
      sparkle: ${{ steps.changes.outputs.sparkle }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup toolchain
        uses: ./.github/actions/setup-workspace
        with:
          install: 'false'

      # Paths are filtered here rather than with `paths-ignore`: these four checks read the
      # documentation, and a skipped workflow would leave a required check pending forever.
      - name: Detect changed paths
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DOCUMENTATION_PATHS: '^(docs/|(README|README_zh|CHANGELOG|CHANGELOG_zh|CONTEXT|AGENTS|CLAUDE|PRIVACY)\.md$|\.github/pull_request_template\.md$|apps/desktop/AGENTS\.md$)'
          SPARKLE_PATHS: '^(apps/desktop/native/|apps/desktop/scripts/(prepare|smoke)-sparkle\.mjs$|apps/desktop/package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.github/workflows/ci\.yml$)'
        run: |
          code=true
          sparkle=true
          if [ -n "$PR_NUMBER" ]; then
            files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" \
              --jq '.[] | .filename, .previous_filename // empty')
            grep -qvE "$DOCUMENTATION_PATHS" <<<"$files" || code=false
            grep -qE "$SPARKLE_PATHS" <<<"$files" || sparkle=false
          fi
          echo "code=$code" >>"$GITHUB_OUTPUT"
          echo "sparkle=$sparkle" >>"$GITHUB_OUTPUT"

      - name: Gate documentation check
        run: pnpm gate:check

      - name: Effect v4 boundary check
        run: pnpm effect:check

      - name: Documentation path check
        run: pnpm docs:check-paths

      - name: UI primitive boundary check
        run: pnpm ui:check-primitives

  static:
    name: Lint, format and typecheck
    needs: preflight
    if: needs.preflight.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          install-args: --ignore-scripts

      - name: Restore Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-v2-static-${{ hashFiles('pnpm-lock.yaml', 'mise.toml') }}-${{ github.sha }}
          restore-keys: |
            turbo-v2-static-${{ hashFiles('pnpm-lock.yaml', 'mise.toml') }}-

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Test (${{ matrix.name }})
    needs: preflight
    if: needs.preflight.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: packages
            cache: packages
            args: --filter=!@yomitomo/desktop
          - name: desktop 1/4
            cache: desktop-1
            args: --filter=@yomitomo/desktop -- --shard=1/4
          - name: desktop 2/4
            cache: desktop-2
            args: --filter=@yomitomo/desktop -- --shard=2/4
          - name: desktop 3/4
            cache: desktop-3
            args: --filter=@yomitomo/desktop -- --shard=3/4
          - name: desktop 4/4
            cache: desktop-4
            args: --filter=@yomitomo/desktop -- --shard=4/4
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          install-args: --ignore-scripts

      - name: Restore Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-v2-test-${{ matrix.cache }}-${{ hashFiles('pnpm-lock.yaml', 'mise.toml') }}-${{ github.sha }}
          restore-keys: |
            turbo-v2-test-${{ matrix.cache }}-${{ hashFiles('pnpm-lock.yaml', 'mise.toml') }}-

      - name: Test
        run: pnpm test ${{ matrix.args }}

  build:
    name: Build and desktop e2e
    needs: preflight
    if: needs.preflight.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Restore Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-v2-build-${{ hashFiles('pnpm-lock.yaml', 'mise.toml') }}-${{ github.sha }}
          restore-keys: |
            turbo-v2-build-${{ hashFiles('pnpm-lock.yaml', 'mise.toml') }}-

      - name: Build
        run: pnpm build

      - name: Desktop e2e smoke
        run: xvfb-run -a pnpm test:app:e2e:from-dist

  sparkle:
    name: macOS Sparkle updates
    needs: preflight
    if: needs.preflight.outputs.sparkle == 'true'
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          package-manager-cache: false

      # The smoke test only uses Electron, its headers and Sparkle, not the workspace.
      - name: Install Electron and headers
        run: |
          version=$(sed -nE "s/^  electron@([0-9][^:(]*):.*/\1/p" pnpm-lock.yaml | head -1)
          npm install --prefix "$RUNNER_TEMP/electron" "electron@$version"
          echo "NODE_PATH=$RUNNER_TEMP/electron/node_modules" >>"$GITHUB_ENV"
          mkdir -p "$HOME/.electron-gyp/$version"
          curl --fail --silent --show-error --location \
            "https://artifacts.electronjs.org/headers/dist/v$version/node-v$version-headers.tar.gz" |
            tar -xz --strip-components=1 -C "$HOME/.electron-gyp/$version"

      - name: Build native Sparkle bridge
        run: node apps/desktop/scripts/prepare-sparkle.mjs

      - name: Verify signed delta updates and full fallback
        run: node apps/desktop/scripts/smoke-sparkle.mjs

  ci-ok:
    name: CI OK
    needs: [preflight, static, test, build, sparkle]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
