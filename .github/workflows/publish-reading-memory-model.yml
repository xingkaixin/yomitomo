name: Publish Reading Memory Model

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reading-memory-model-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Publish selected model
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo '::error::Model publication must run from main.'
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish and verify model objects
        run: pnpm --filter @yomitomo/download model:publish
