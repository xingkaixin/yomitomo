name: Setup workspace
description: Set up the pinned pnpm and Node toolchain, then install workspace dependencies.

inputs:
  install:
    description: Whether to install workspace dependencies
    default: 'true'
  install-args:
    description: Extra arguments for pnpm install
    default: ''

runs:
  using: composite
  steps:
    # pnpm would otherwise run a full install before the first script of a job that skips it.
    - name: Keep scripts from reinstalling dependencies
      shell: bash
      run: echo 'pnpm_config_verify_deps_before_run=false' >>"$GITHUB_ENV"

    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    # A fresh pnpm install beats restoring the 0.6-1 GB store on every runner OS.
    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24.22.3
        package-manager-cache: false

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile ${{ inputs.install-args }}
