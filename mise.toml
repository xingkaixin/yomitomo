[tools]
node = "24.22.2"
pnpm = "12.16.1"

[tasks."lint"]
run = "pnpm lint"

[tasks."format:check"]
run = "pnpm format:check"

[tasks."typecheck"]
run = "pnpm typecheck"

[tasks."test"]
run = "pnpm test"

[tasks."test:app:e2e"]
run = "pnpm test:app:e2e"

[tasks."test:app:e2e:from-dist"]
run = "pnpm test:app:e2e:from-dist"

[tasks."build"]
run = "pnpm build"

[tasks."check:fast"]
run = [
  { task = "lint" },
  { task = "format:check" },
  { task = "typecheck" },
  { task = "test" },
]

[tasks."check"]
run = [
  { task = "lint" },
  { task = "format:check" },
  { task = "typecheck" },
  { task = "test" },
  { task = "build" },
  { task = "test:app:e2e:from-dist" },
]
