[tools]
node = "24.22.3"
pnpm = "12.23.0"

[tasks."lint"]
run = "pnpm lint"

[tasks."format:check"]
run = "pnpm format:check"

[tasks."typecheck"]
run = "pnpm typecheck"

[tasks."test"]
run = "pnpm test"

[tasks."test:app:e2e"]
run = "pnpm test:app:e2e"

[tasks."test:app:e2e:from-dist"]
run = "pnpm test:app:e2e:from-dist"

[tasks."build"]
run = "pnpm build"

[tasks."ai:emulate"]
description = "Start a local emulate AI server for debugging"
run = '''
if ! command -v emulate >/dev/null 2>&1; then
  echo "emulate CLI not found. Install it first (e.g. mise use -g npm:emulate)." >&2
  exit 1
fi
exec emulate start --service ai --port "${EMULATE_AI_PORT:-4014}" --watch --seed scripts/emulate-ai.yaml "$@"
'''

[tasks."check:fast"]
run = [
  { task = "lint" },
  { task = "format:check" },
  { task = "typecheck" },
  { task = "test" },
]

[tasks."check"]
run = [
  { task = "lint" },
  { task = "format:check" },
  { task = "typecheck" },
  { task = "test" },
  { task = "build" },
  { task = "test:app:e2e:from-dist" },
]
